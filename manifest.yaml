manifestVersion: 1
name: "@shrug/vyos"
version: "2026.11.17.1"
description: "Manage a VyOS router over SSH: read the running config, apply set/delete commands via vbash, and run arbitrary op-/config-mode commands."

repository: https://github.com/shrugpw/swamp-vyos

additionalFiles:
  - README.md
  - LICENSE.txt

models:
  - vyos.ts

reports:
  - vyos_firewall.ts

# Empty platforms == universal (earns both platform factors). The model shells
# out to the host `ssh` binary, which is present on linux and darwin alike.
platforms: []
